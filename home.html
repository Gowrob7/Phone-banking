<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Home</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">


<!-- FONTS -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap" rel="stylesheet">

<!-- font awsome icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
    *{
        font-family: "Outfit", sans-serif;
    }
</style>
</head>
<body class="min-h-screen max-w-md bg-base-200 mx-auto">
   <header class="border border-b-2 border-gray-300 sticky top-0 z-10 bg-base-200" >

    <section class="w-11/12 mx-auto py-3 flex justify-between items-center ">
        <div class="left  flex gap-2 ">
            <div class="logo w-[60px]">
                <img src="./assets/logo.png" alt="">
            </div>
            <div class="balence">
                <h2 class="text-2xl font-bold "><i class="fa-solid fa-bangladeshi-taka-sign" style="color: rgb(8, 8, 8);"></i><span id="balence">4348</span></h2>
               <p class="text-neutral/70/50">Available Balence</p>
            </div>
        </div>

        <div class="right">
           <a href="./index.html" class="btn btn-soft"><i class="fa-solid fa-arrow-right-from-bracket" style="color: rgb(111, 122, 116);"></i> Log out</a >
        </div>
    </section>
   </header>

   <section class="w-11/12 mx-auto py-10 space-y-3">
    <h2 class="text-3xl font-bold">Welcome to Pay<span class="text-primary">oo</span></h2>
     <p class="text-neutral/70/50">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>

     <div class="button grid grid-cols-3 gap-9 space-y-4 ">
        <button class="btn flex-col h-full btn-primary btn-soft rounded-2xl" onclick="showOnly('add-money')">
            <img src="./assets/opt-1.png" alt="">
            <p>Add Money</p>
        </button>
        <button onclick="showOnly('cashout')" class="btn flex-col h-full btn-primary btn-soft rounded-2xl">
            <img src="./assets/opt-1.png" alt="">
            <p>Cashout</p>
        </button>
        <button onclick="showOnly('transfer-money')" class="btn flex-col h-full btn-primary btn-soft rounded-2xl">
            <img src="./assets/opt-2.png" alt="">
            <p>Transfer Money</p>
        </button>
        <button onclick="showOnly('payment')" class="btn flex-col h-full btn-primary btn-soft rounded-2xl">
            <img src="./assets/opt-3.png" alt="">
            <p>Pay Bill</p>
        </button>
        <button onclick="showOnly('bonus')" class="btn flex-col h-full btn-primary btn-soft rounded-2xl">
            <img src="./assets/opt-4.png" alt="">
            <p>Get Bonus</p>
        </button>
        <button onclick="showOnly('history')" class="btn flex-col h-full btn-primary btn-soft rounded-2xl">
            <img src="./assets/opt-1.png" alt="">
            <p>Transactions</p>
        </button>
     </div>
    </section>

     <!-- Add Money section -->

     <section id="add-money"  class="Cashout w-11/12 mx-auto py-5 hidden">
        <h2 class="text-neutral font-bold mb-2 text-[15px]">Add Money</h2>

           <div class="form  bg-base-100 w-full shadow rounded-2xl  ">
            <div class="card-body">
        <fieldset class="fieldset ">

            <label class="label font-bold text-neutral/70 ">Select Bank</label>
            <select id="add-money-bank" class="select rounded-full bg-base-200 w-full">
  <option disabled selected>Select a Bank</option>
  <option value="DDBL">DDBL</option>
  <option value="IBBL">IBBL</option>
  <option value="ITBL">ITBL</option>
</select>
  <br>
  <label class="label font-bold text-neutral/70">Bank Account Number</label>
  <input id="bank-number" type="number" class="input rounded-full bg-base-200 w-full text-neutral/70" placeholder="Enter 11 digit account number" />
  <br>
  <label class="label font-bold text-neutral/70">Amount to Add</label>
  <input id="bank-amount" type="text" class="input rounded-full bg-base-200 w-full" placeholder="Add Amount to withdraw" />
  <br>
            
  <label class="label font-bold text-neutral/70 ">Pin Number</label>
  <input id="bank-pin" type="password" class="input rounded-full bg-base-200 w-full"   placeholder="Enter 4 digit pin number" />
  <br>

  <button id="add-money-btn" class="btn btn-primary mt-4 rounded-full bg-[#3B25C1]">Add Money</button>
</fieldset>
            </div>
    </div>
     
     </section>
    

    <!-- cashout section -->

   <section id="cashout" class="Cashout w-11/12 mx-auto py-5 hidden">
       <h2 class="text-neutral font-bold mb-2 text-[15px]">Cash Out</h2>
       <div class="form  bg-base-100 w-full shadow rounded-2xl ">
        <fieldset class="fieldset bg-base-200 border-base-300 rounded-xl w-full border p-4  shadow-md pt-10  mx-auto space-y-3">
  
  <label class="label font-bold text-neutral/70">Agent Number</label>
  <input id="agent-number" type="number" class="input rounded-full bg-base-200 w-full text-neutral/70" placeholder="Enter Your Agent Number" />
  <label class="label font-bold text-neutral/70">Amount</label>
  <input id="cashout-amount" type="text" class="input rounded-full bg-base-200 w-full" placeholder="Enter amount to withdraw" />
            
  <label class="label font-bold text-neutral/70 ">4 digit pin</label>
  <input id="cashout-pin" type="password" class="input rounded-full bg-base-200 w-full"   placeholder="Enter 4 digit pin number" />

  <button id="cashout-btn" class="btn btn-primary mt-4 rounded-full bg-[#3B25C1]">Withdraw Money</button>
</fieldset>
    </div>
</section>

<section id="transfer-money"  class="Transfer-money w-11/12 mx-auto py-5 hidden">
     <h2 class="text-neutral font-bold mb-2 text-[15px]">Transfer Money</h2>
      <div class="form  bg-base-100 w-full shadow rounded-2xl  ">
            <div class="card-body">
        <fieldset class="fieldset ">

            
   

  <label class="label font-bold text-neutral/70">User Account Number</label>
  <input id="money-transfer-number" type="number" class="input rounded-full bg-base-200 w-full text-neutral/70" placeholder="Enter 11 digit account number" />
  <br>
  <label class="label font-bold text-neutral/70">Amount </label>
  <input id="money-transfer-amount" type="text" class="input rounded-full bg-base-200 w-full" placeholder="Add Amount to withdraw" />
  <br>
            
  <label class="label font-bold text-neutral/70 ">Pin Number</label>
  <input id="money-transfer-pin" type="password" class="input rounded-full bg-base-200 w-full"   placeholder="Enter 4 digit pin number" />
  <br>

  <button id="money-transfer-btn" class="btn btn-primary mt-4 rounded-full bg-[#3B25C1]">Send Now</button>
</fieldset>
            </div>
    </div>
     
</section>

<section id="payment" class="Transfer-money w-11/12 mx-auto py-5 hidden">
    <h2 class="text-neutral font-bold mb-2 text-[15px]">Pay Bill</h2>
     <div class="form  bg-base-100 w-full shadow rounded-2xl  ">
            <div class="card-body">
        <fieldset class="fieldset ">

              <label class="label font-bold text-neutral/70 ">Select Bank</label>
            <select id="pay-billbank" class="select rounded-full bg-base-200 w-full">
  <option disabled selected>Select Payment Method</option>
  <option value="DDBL">DDBL</option>
  <option value="ROCKET">ROCKET</option>
  <option value="ITBL">BKASH</option>
  <option value="NAGAD">NAGAD</option>
</select>
<br>
   

  <label class="label font-bold text-neutral/70">Biller Account Number</label>
  <input id="Pay-bill-number" type="number" class="input rounded-full bg-base-200 w-full text-neutral/70" placeholder="Enter account number" />
  <br>
  <label class="label font-bold text-neutral/70">Amount to Pay </label>
  <input id="Pay-billamount" type="text" class="input rounded-full bg-base-200 w-full" placeholder="Add Amount to pay" />
  <br>
            
  <label class="label font-bold text-neutral/70 ">Pin Number</label>
  <input id="Pay-bill-pin" type="password" class="input rounded-full bg-base-200 w-full"   placeholder="Enter 4 digit pin number" />
  <br>

  <button id="Pay-bill-btn" class="btn btn-primary mt-4 rounded-full bg-[#3B25C1]">Pay Bill</button>
</fieldset>
            </div>
    </div>
     
</section>

<section id="bonus" class="w-11/12 mx-auto py-5 hidden">
    <h2 class="text-neutral font-bold mb-4 text-[18px]">Get Bonus</h2>
    

    <div class="form  bg-base-100 w-full shadow rounded-2xl ">
            <div class="card-body ">
        <fieldset class="fieldset ">

  <label class="label font-bold text-neutral/70 mb-2 text-[16px]">Enter Bonus Coupon</label>
  <input id="coupon" type="text" class="input rounded-full bg-base-200 w-full text-neutral/70" placeholder="Enter Your Coupon" />
  

  <button id="get-bonus-btn" class="btn btn-primary mt-4 rounded-full bg-[#3B25C1]">Get Bonus</button>
</fieldset>
            </div>
    </div>
</section>

<section  id="history" class="trancition-card w-11/12 mx-auto py-5 hidden">
    <h2 class="font-bold mb-2 text-[19px]" >Transaction History</h2>
    <div id="history-container" class="CARD">
        <div class="bg-base-200 ">
            
        </div>
    </div>
    
</section>

<script src="./script/machine.js"></script>
<script src="./script/addMoney.js"></script>
<script src="./script/cashOut.js"></script>
<script src="./script/transfer_money.js"></script>
<script src="./script/payBill.js"></script>
<script src="./script/Get_bonus.js"></script>
</body>
</html>
