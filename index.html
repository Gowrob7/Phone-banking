<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payoo || login</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">


<!-- FONTS -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap" rel="stylesheet">

<!-- font awsome icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
    *{
        font-family: "Outfit", sans-serif;
    }
</style>
</head>
<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <div class="logo w-[200px] mx-auto pt-32">
        <img src="./assets/Logo-full.png" alt="">
    </div>

    <!-- form section -->
    <div class="form pt-10">
        <fieldset class="fieldset bg-base-200 border-base-300 rounded-md w-xs border p-4 shrink-1 shadow-md pt-10 w-[433px] mx-auto">
  

  <label class="label font-bold text-neutral">Mobile Number</label>
  <input id="number" type="text" class="input rounded-full bg-base-200" maxlength="11" minlength="11" placeholder="Enter your 11 digit number" />
            <br>
  <label class="label font-bold text-neutral ">4 digit pin</label>
  <input id="pin-code" type="password" class="input rounded-full bg-base-200 "  maxlength="4" minlength="4" placeholder="Enter your 4 digit pin" />

  <button id="login-btn" class="btn btn-primary mt-4 rounded-full bg-[#3B25C1]">Login</button>
</fieldset>
    </div>

    <script src="/script/login.js"></script>
</body>
</html>
